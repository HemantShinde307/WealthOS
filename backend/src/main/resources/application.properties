spring.application.name=auth-service
server.port=${PORT:8081}

# Local dev defaults on the right of each ':' — Railway (or any host) overrides these via its
# own env vars (MYSQLHOST/MYSQLPORT/MYSQLDATABASE/MYSQLUSER/MYSQLPASSWORD come from Railway's
# MySQL plugin automatically when referenced like this).
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:wealthos_auth}?useSSL=false&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Comma-separated list — add the GitHub Pages origin here once deployed (see CorsConfig.java).
app.cors.allowed-origin=${CORS_ALLOWED_ORIGINS:http://localhost:4300}

# Signing key for session tokens (32+ characters). If unset, a random per-run key is generated
# (safe, but logins end on every restart) — set JWT_SECRET in any real deployment.
app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl-minutes=${JWT_TTL_MINUTES:480}

# Daily NAVs from AMFI (see com.wealthos.auth.nav). The URL must be https on amfiindia.com.
app.nav.source-url=${NAV_SOURCE_URL:https://portal.amfiindia.com/spages/NAVAll.txt}
app.nav.enabled=${NAV_REFRESH_ENABLED:true}
app.nav.refresh-on-startup=${NAV_REFRESH_ON_STARTUP:true}
