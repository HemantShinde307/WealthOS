<div class="space-y-6">
  <div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-4">
    <p class="font-semibold text-on-background">{{ state.planName() }}</p>
    <p class="text-xs text-on-surface-variant mt-0.5">{{ state.frequency() }} SIP &middot; Live rate ₹{{ currentRate | number }}/gram</p>
  </div>

  <div>
    <label class="text-sm font-medium text-on-background block mb-2">Instalment Amount</label>
    <div class="relative">
      <span class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant font-mono">₹</span>
      <input
        type="number"
        class="w-full pl-8 pr-4 py-3 border border-outline-variant rounded-md text-2xl font-mono font-bold bg-surface-container-lowest focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary/30"
        [value]="state.amount()"
        (input)="onAmountInput($event)"
      />
    </div>
    <div class="flex flex-wrap gap-2 mt-3">
      @for (a of quickAmounts; track a) {
        <button
          class="px-3 py-1.5 rounded-full text-xs font-medium border transition-colors"
          [class]="state.amount() === a ? 'bg-primary-container text-on-primary border-primary-container' : 'border-outline-variant text-on-surface-variant hover:bg-surface-container-low'"
          (click)="setAmount(a)"
        >
          ₹{{ a | number }}
        </button>
      }
    </div>
  </div>

  <div class="bg-surface-container-low rounded-lg p-4 space-y-2 text-sm">
    <div class="flex justify-between"><span class="text-on-surface-variant">Gold accumulated per instalment</span><span class="font-mono text-gold font-semibold">{{ gramsPerInstalment() }} g</span></div>
    <div class="flex justify-between"><span class="text-on-surface-variant">Estimated annual investment</span><span class="font-mono text-on-background">₹{{ annualInvestment() | number }}</span></div>
  </div>

  <button class="w-full bg-primary-container text-on-primary py-3 rounded-md font-medium hover:opacity-90 transition-opacity disabled:opacity-50" [disabled]="state.amount() <= 0" (click)="continue()">
    Continue to Review
  </button>
</div>
