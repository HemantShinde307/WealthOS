<div class="space-y-5">
  <div>
    <label class="text-sm font-medium text-on-background block mb-1.5">Full Name</label>
    <input
      type="text"
      class="w-full px-4 py-2.5 border border-outline-variant rounded-md text-sm bg-surface-container-lowest focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary/30"
      placeholder="As per PAN card"
      [value]="state.fullName()"
      (input)="state.fullName.set($any($event.target).value)"
    />
  </div>

  <div class="grid grid-cols-2 gap-4">
    <div>
      <label class="text-sm font-medium text-on-background block mb-1.5">PAN Number</label>
      <input
        type="text"
        maxlength="10"
        class="w-full px-4 py-2.5 border border-outline-variant rounded-md text-sm font-mono uppercase bg-surface-container-lowest focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary/30"
        placeholder="ABCDE1234F"
        [value]="state.pan()"
        (input)="state.pan.set($any($event.target).value.toUpperCase())"
      />
    </div>
    <div>
      <label class="text-sm font-medium text-on-background block mb-1.5">Date of Birth</label>
      <input
        type="date"
        class="w-full px-4 py-2.5 border border-outline-variant rounded-md text-sm bg-surface-container-lowest focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary/30"
        [value]="state.dob()"
        (input)="state.dob.set($any($event.target).value)"
      />
    </div>
  </div>

  <div class="grid grid-cols-2 gap-4">
    <div>
      <label class="text-sm font-medium text-on-background block mb-1.5">Email</label>
      <input
        type="email"
        class="w-full px-4 py-2.5 border border-outline-variant rounded-md text-sm bg-surface-container-lowest focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary/30"
        placeholder="you@example.com"
        [value]="state.email()"
        (input)="state.email.set($any($event.target).value)"
      />
    </div>
    <div>
      <label class="text-sm font-medium text-on-background block mb-1.5">Mobile Number</label>
      <input
        type="tel"
        class="w-full px-4 py-2.5 border border-outline-variant rounded-md text-sm bg-surface-container-lowest focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary/30"
        placeholder="+91 98765 43210"
        [value]="state.phone()"
        (input)="state.phone.set($any($event.target).value)"
      />
    </div>
  </div>

  <div>
    <label class="text-sm font-medium text-on-background block mb-1.5">Address</label>
    <input
      type="text"
      class="w-full px-4 py-2.5 border border-outline-variant rounded-md text-sm bg-surface-container-lowest focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary/30"
      placeholder="House/Flat No., Street, Locality"
      [value]="state.addressLine()"
      (input)="state.addressLine.set($any($event.target).value)"
    />
  </div>

  <div class="grid grid-cols-3 gap-4">
    <div>
      <label class="text-sm font-medium text-on-background block mb-1.5">City</label>
      <input
        type="text"
        class="w-full px-4 py-2.5 border border-outline-variant rounded-md text-sm bg-surface-container-lowest focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary/30"
        [value]="state.city()"
        (input)="state.city.set($any($event.target).value)"
      />
    </div>
    <div>
      <label class="text-sm font-medium text-on-background block mb-1.5">State</label>
      <select
        class="w-full px-4 py-2.5 border border-outline-variant rounded-md text-sm bg-surface-container-lowest focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary/30"
        [value]="state.state()"
        (change)="state.state.set($any($event.target).value)"
      >
        <option value="" disabled selected>Select</option>
        @for (s of indianStates; track s) {
          <option [value]="s">{{ s }}</option>
        }
      </select>
    </div>
    <div>
      <label class="text-sm font-medium text-on-background block mb-1.5">Pincode</label>
      <input
        type="text"
        maxlength="6"
        class="w-full px-4 py-2.5 border border-outline-variant rounded-md text-sm font-mono bg-surface-container-lowest focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary/30"
        [value]="state.pincode()"
        (input)="state.pincode.set($any($event.target).value)"
      />
    </div>
  </div>

  <button
    class="w-full bg-primary-container text-on-primary py-3 rounded-md font-medium hover:opacity-90 transition-opacity disabled:opacity-50"
    [disabled]="!state.clientDetailsValid()"
    (click)="continue()"
  >
    Continue
  </button>
</div>
