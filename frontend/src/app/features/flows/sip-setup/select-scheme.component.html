<div class="space-y-4">
  <div class="flex flex-col sm:flex-row gap-3">
    <div class="relative flex-1">
      <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline text-[20px]">search</span>
      <input
        class="w-full pl-10 pr-4 py-2.5 border border-outline-variant rounded-md text-sm bg-surface-container-lowest focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary/30"
        placeholder="Search schemes..."
        [value]="search()"
        (input)="search.set($any($event.target).value)"
      />
    </div>
    <div class="flex gap-2">
      @for (a of assetClasses; track a) {
        <button
          class="px-3 py-2 rounded-md text-xs font-medium border transition-colors"
          [class]="assetFilter() === a ? 'bg-primary-container text-on-primary border-primary-container' : 'border-outline-variant text-on-surface-variant hover:bg-surface-container-low'"
          (click)="assetFilter.set(a)"
        >
          {{ a }}
        </button>
      }
    </div>
  </div>

  <div class="space-y-3">
    @for (s of filteredSchemes(); track s.id) {
      <button class="w-full text-left bg-surface-container-lowest border border-outline-variant rounded-lg p-4 hover:border-secondary transition-colors flex justify-between items-center gap-4" (click)="select(s.id)">
        <div class="min-w-0">
          <p class="font-semibold text-on-background truncate">{{ s.name }}</p>
          <p class="text-xs text-on-surface-variant mt-0.5">{{ s.amc }} &middot; {{ s.category }} &middot; Min SIP ₹{{ s.minSip | number }}</p>
          <div class="flex items-center gap-1 mt-1">
            @for (star of [1, 2, 3, 4, 5]; track star) {
              <span class="material-symbols-outlined text-[14px]" [class]="star <= s.rating ? 'text-gold fill-icon' : 'text-outline-variant fill-icon'">star</span>
            }
          </div>
        </div>
        <div class="text-right shrink-0">
          <p class="font-mono text-lg font-bold text-on-tertiary-container">{{ s.returns3y }}%</p>
          <p class="text-xs text-on-surface-variant">3Y Returns</p>
        </div>
      </button>
    }
    @if (!filteredSchemes().length) {
      <p class="text-center text-on-surface-variant py-8">No schemes match your search.</p>
    }
  </div>
</div>
