<div class="flex flex-col items-center text-center py-8 gap-4">
  <div class="w-20 h-20 rounded-full bg-tertiary-container/10 flex items-center justify-center">
    <span class="material-symbols-outlined text-on-tertiary-container text-[48px] fill-icon">check_circle</span>
  </div>
  <h2 class="text-headline-lg text-on-background">SIP Activated Successfully</h2>
  <p class="text-on-surface-variant max-w-sm">
    Your SIP {{ state.lastSipId() }} of ₹{{ state.amount() | number }}/month has been set up and will be debited on the {{ state.sipDate() }} of every month via e-NACH.
  </p>
  <button class="mt-4 bg-primary-container text-on-primary px-6 py-3 rounded-md font-medium hover:opacity-90 transition-opacity" (click)="goToPortfolio()">
    Back to Portfolio
  </button>
</div>
