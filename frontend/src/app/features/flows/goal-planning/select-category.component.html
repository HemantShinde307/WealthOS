<div class="space-y-4">
  <p class="text-sm text-on-surface-variant">What are you investing towards? Choose a goal category to get started.</p>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
    @for (c of categories; track c.category) {
      <button
        class="text-left bg-surface-container-lowest border border-outline-variant rounded-lg p-4 hover:border-secondary transition-colors flex items-start gap-3"
        (click)="select(c)"
      >
        <div class="w-10 h-10 rounded-lg bg-secondary-container/10 text-secondary flex items-center justify-center shrink-0">
          <span class="material-symbols-outlined">{{ c.icon }}</span>
        </div>
        <div class="min-w-0">
          <p class="font-semibold text-on-background">{{ c.category }}</p>
          <p class="text-xs text-on-surface-variant mt-0.5">{{ c.description }}</p>
        </div>
      </button>
    }
  </div>
</div>
