<div class="min-h-screen bg-background flex items-center justify-center p-6 py-10">
  <div class="w-full max-w-md">
    <div class="flex flex-col items-center mb-8">
      <img [src]="tenant.logoSrc()" alt="" class="w-14 h-14 rounded-2xl object-cover mb-3" />
      <h1 class="text-headline-lg-mobile text-on-background font-bold">Create your account</h1>
      <p class="text-sm text-on-surface-variant mt-1">Start investing with {{ tenant.brandName() }} in minutes</p>
    </div>

    <div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-6 sm:p-8 shadow-sm space-y-5">
      <div>
        <label class="text-sm font-medium text-on-background block mb-2">Full Name</label>
        <input
          class="w-full px-4 py-2.5 border border-outline-variant rounded-md text-sm bg-surface-container-lowest focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary/30"
          placeholder="As per PAN"
          [value]="fullName()"
          (input)="fullName.set($any($event.target).value)"
        />
      </div>

      <div>
        <label class="text-sm font-medium text-on-background block mb-2">Email</label>
        <input
          type="email"
          autocomplete="email"
          class="w-full px-4 py-2.5 border border-outline-variant rounded-md text-sm bg-surface-container-lowest focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary/30"
          placeholder="you@example.com"
          [value]="email()"
          (input)="email.set($any($event.target).value)"
        />
      </div>

      <div>
        <label class="text-sm font-medium text-on-background block mb-2">Mobile Number</label>
        <input
          type="tel"
          class="w-full px-4 py-2.5 border border-outline-variant rounded-md text-sm bg-surface-container-lowest focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary/30"
          placeholder="+91 98765 43210"
          [value]="phone()"
          (input)="phone.set($any($event.target).value)"
        />
      </div>

      <div>
        <label class="text-sm font-medium text-on-background block mb-2">Password</label>
        <div class="relative">
          <input
            [type]="showPassword() ? 'text' : 'password'"
            autocomplete="new-password"
            class="w-full px-4 py-2.5 pr-10 border border-outline-variant rounded-md text-sm bg-surface-container-lowest focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary/30"
            placeholder="At least 6 characters"
            [value]="password()"
            (input)="password.set($any($event.target).value)"
          />
          <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant" (click)="showPassword.set(!showPassword())">
            <span class="material-symbols-outlined text-[18px]">{{ showPassword() ? 'visibility_off' : 'visibility' }}</span>
          </button>
        </div>
      </div>

      <div>
        <label class="text-sm font-medium text-on-background block mb-2">Confirm Password</label>
        <input
          [type]="showPassword() ? 'text' : 'password'"
          autocomplete="new-password"
          class="w-full px-4 py-2.5 border border-outline-variant rounded-md text-sm bg-surface-container-lowest focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary/30"
          placeholder="Re-enter your password"
          [value]="confirmPassword()"
          (input)="confirmPassword.set($any($event.target).value)"
          (keydown.enter)="submit()"
        />
        @if (confirmPassword().length > 0 && !passwordsMatch()) {
          <p class="text-xs text-error mt-1">Passwords do not match.</p>
        }
      </div>

      <label class="flex items-start gap-2 cursor-pointer">
        <input type="checkbox" class="w-4 h-4 rounded border-outline-variant text-secondary mt-0.5 shrink-0" [checked]="agreedToTerms()" (change)="agreedToTerms.set($any($event.target).checked)" />
        <span class="text-xs text-on-surface-variant">I agree to the Terms of Service and Privacy Policy, and consent to KYC verification as required by SEBI regulations.</span>
      </label>

      @if (error()) {
        <div class="bg-error-container/50 rounded-lg p-3 text-sm text-on-error-container flex gap-2">
          <span class="material-symbols-outlined text-[18px] shrink-0">error</span>
          <span>{{ error() }}</span>
        </div>
      }

      <button
        class="w-full bg-primary-container text-on-primary py-3 rounded-md font-medium hover:opacity-90 transition-opacity disabled:opacity-50"
        [disabled]="submitting()"
        (click)="submit()"
      >
        {{ submitting() ? 'Creating account…' : 'Create Account' }}
      </button>
    </div>

    <p class="text-center text-sm text-on-surface-variant mt-6">
      Already have an account?
      <a routerLink="/login" class="text-secondary font-medium hover:underline">Sign in</a>
    </p>
  </div>
</div>
